<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sem conexão · Autoscar CRM</title>
    <link rel="icon" href="/favicon-autoscar.png" />
    <style>
      :root { color-scheme: light dark; }
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        font-family: 'Outfit', system-ui, -apple-system, sans-serif;
        background: #0f0f0f;
        color: #f5f5f5;
      }
      @media (prefers-color-scheme: light) {
        html, body { background: #fafafa; color: #171717; }
      }
      .wrap {
        min-height: 100vh;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: 24px; text-align: center;
      }
      .logo { width: 64px; height: 64px; border-radius: 16px; background: rgba(220,38,38,0.12); display:flex; align-items:center; justify-content:center; margin-bottom: 20px; }
      .logo img { width: 40px; height: 40px; }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { font-size: 14px; opacity: 0.7; margin: 0 0 24px; max-width: 320px; }
      button {
        background: #dc2626; color: white; border: 0; padding: 12px 20px;
        border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer;
      }
      button:hover { background: #b91c1c; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="logo"><img src="/favicon-autoscar.png" alt="Autoscar" /></div>
      <h1>Você está offline</h1>
      <p>Não conseguimos conectar ao servidor. Verifique sua conexão e tente novamente.</p>
      <button onclick="location.reload()">Tentar novamente</button>
    </div>
  </body>
</html>
