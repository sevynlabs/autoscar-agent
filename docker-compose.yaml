# Production compose for Coolify deployment
# Postgres is external (Supabase) — backed up daily by the db-backup service
# Evolution API is external
# Coolify proxy handles SSL + domain routing → frontend:3000

services:
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - autoscar-net

  app:
    build: .
    restart: always
    # Allow the container to reach the Coolify host (where the managed
    # Postgres publishes port 5433). Used in DATABASE_URL below.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Auto-recovery: if /health stops responding for 3 checks in a row,
    # Docker marks the container unhealthy and restart: always kicks in.
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    environment:
      - APP_PORT=3001
      - APP_BASE_URL=http://app:3001
      - FRONTEND_URL=http://frontend:3000
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - EVOLUTION_API_URL=${EVOLUTION_API_URL}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - JWT_SECRET=${JWT_SECRET:-autoscar-jwt-secret-change-me}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - SELLERS_GROUP_JID=${SELLERS_GROUP_JID:-}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-}
      - MINIO_USER=${MINIO_USER:-}
      - MINIO_PASSWORD=${MINIO_PASSWORD:-}
      - NODE_ENV=production
    depends_on:
      - redis
    networks:
      - autoscar-net
      - coolify

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://app:3001
    # Auto-recovery: if /healthz stops responding for 3 checks in a row, Docker
    # marks the container unhealthy and restart: always brings it back.
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - app
    # The Coolify proxy routes autoscar.soft7ai.com (UI + /api/* webhooks) to
    # this container. Join its network explicitly so a redeploy can't leave the
    # proxy without a route ("503 no available server" → no WhatsApp webhooks).
    networks:
      - autoscar-net
      - coolify

  # Daily pg_dump of the production database (Supabase). Coolify's built-in
  # backups only cover Coolify-managed databases, so this sidecar does it:
  # one dump at startup, then every day at 03:00 (America/Sao_Paulo), keeping
  # the newest BACKUP_KEEP files in the db_backups volume. Output goes to the
  # container logs ("[backup] ok ..." / "[backup] FAILED").
  # Restore: pg_restore --no-owner -d "<url>" autoscar_<date>.dump
  db-backup:
    image: postgres:17-alpine
    restart: always
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - BACKUP_KEEP=14
      - TZ=America/Sao_Paulo
    volumes:
      - db_backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /usr/local/bin/backup.sh <<'EOF'
        #!/bin/sh
        f=/backups/autoscar_$$(date +%Y-%m-%d_%H%M).dump
        if pg_dump "$$DATABASE_URL" -n public -Fc --no-owner --no-privileges -f "$$f.tmp"; then
          mv "$$f.tmp" "$$f"
          echo "[backup] ok $$f $$(du -h "$$f" | cut -f1)"
        else
          rm -f "$$f.tmp"
          echo "[backup] FAILED"
        fi
        ls -1t /backups/autoscar_*.dump 2>/dev/null | tail -n +$$((BACKUP_KEEP + 1)) | xargs -r rm -f
        EOF
        chmod +x /usr/local/bin/backup.sh
        /usr/local/bin/backup.sh
        echo "0 3 * * * /usr/local/bin/backup.sh > /proc/1/fd/1 2>&1" > /etc/crontabs/root
        exec crond -f -l 8
    networks:
      - autoscar-net

volumes:
  redis_data:
  db_backups:

networks:
  autoscar-net:
    driver: bridge
  coolify:
    external: true
