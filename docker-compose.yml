services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: autoscar
      POSTGRES_USER: autoscar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - autoscar-net

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - autoscar-net

  minio:
    image: minio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - autoscar-net

  evolution-api:
    image: atendai/evolution-api:v2.2.3
    restart: always
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: http://evolution-api:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: 'true'
      CORS_ORIGIN: '*'
      CORS_METHODS: 'POST,GET,PUT,DELETE'
      CORS_CREDENTIALS: 'true'
      LOG_LEVEL: 'ERROR,WARN,INFO'
      LOG_COLOR: 'true'
      LOG_BAILEYS: 'error'
      DEL_INSTANCE: 'false'
      LANGUAGE: pt-BR
      # PostgreSQL persistence — survives restarts
      DATABASE_ENABLED: 'true'
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://autoscar:${POSTGRES_PASSWORD}@postgres:5432/evolution
      DATABASE_SAVE_DATA_INSTANCE: 'true'
      DATABASE_SAVE_DATA_NEW_MESSAGE: 'true'
      DATABASE_SAVE_MESSAGE_UPDATE: 'true'
      DATABASE_SAVE_DATA_CONTACTS: 'true'
      DATABASE_SAVE_DATA_CHATS: 'true'
      # Redis cache disabled — use DB persistence only
      CACHE_REDIS_ENABLED: 'false'
      CACHE_LOCAL_ENABLED: 'true'
      # Webhooks per-instance (configured by app)
      WEBHOOK_GLOBAL_ENABLED: 'false'
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      - postgres
      - redis
    networks:
      - autoscar-net

  app:
    build: .
    restart: always
    env_file: .env
    environment:
      - APP_PORT=3001
      - APP_BASE_URL=http://app:3001
      - FRONTEND_URL=http://frontend:3000
      - DATABASE_URL=postgresql://postgres.cytpszeczdxdcyuhldkz:%40Gratidao7%23@aws-1-sa-east-1.pooler.supabase.com:5432/postgres
      - EVOLUTION_API_URL=${EVOLUTION_API_URL:-http://evolution-api:8080}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://app:3001}
    depends_on:
      - postgres
      - redis
      - evolution-api
    networks:
      - autoscar-net

  frontend:
    build: ./frontend
    restart: always
    environment:
      - BACKEND_URL=http://app:3001
      - NEXT_PUBLIC_SOCKET_URL=http://localhost/socket.io
    depends_on:
      - app
    networks:
      - autoscar-net

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_data:/etc/letsencrypt
    depends_on:
      - app
      - frontend
      - evolution-api
    networks:
      - autoscar-net

volumes:
  postgres_data:
  redis_data:
  minio_data:
  evolution_instances:
  certbot_data:

networks:
  autoscar-net:
    driver: bridge
